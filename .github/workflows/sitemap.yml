name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger it for testing

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://uzairtechguide.github.io/
          sitemap-path: sitemap.xml
          # Explicit relative paths to ensure accurate exclusion
          exclude: |
            components/*
            ind2.html
            tools/ai-subtitles-generator/aisgtest.html
          add-lastmod: true

      - name: Commit and push sitemap
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated: Optimized sitemap.xml"
          file_pattern: sitemap.xml
          # Ensures the commit happens even if only metadata changed
          skip_dirty_check: false
          # Sets a default user for the automated commit
          commit_user_name: "GitHub Action"
          commit_user_email: "actions@github.com"
