name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://uzairtechguide.github.io/
          sitemap-path: sitemap.xml
          add-lastmod: true

      - name: Cleanup sitemap
        shell: bash
        run: |
          # Remove every URL inside the /components/ directory
          perl -0777 -i -pe 's|<url>\s*<loc>https://uzairtechguide\.github\.io/components/.*?</url>\s*||gs' sitemap.xml

          # Remove specific pages
          for page in \
            "ind2.html" \
            "aisgtest.html" \
            "googlebcc723c3e0ed51a2.html"
          do
            perl -0777 -i -pe "s|<url>\s*<loc>https://uzairtechguide\.github\.io/${page}</loc>.*?</url>\s*||gs" sitemap.xml
          done

      - name: Commit and push sitemap
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated: Generated and cleaned sitemap.xml"
          file_pattern: sitemap.xml